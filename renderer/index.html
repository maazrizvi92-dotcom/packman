<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ChatGPT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Urbanist font -->
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Urbanist', sans-serif;
      background: linear-gradient(135deg, #319795, #81E6D9);
      color: #234E52; /* Dark teal for text */
      min-height: 100vh;
    }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-spinner {
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }

    /* Typing cursor */
    .typing-cursor::after {
      content: "|";
      animation: blink 1s steps(1) infinite;
      margin-left: 4px;
      color: #2C7A7B;
      font-weight: 700;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }

    /* Clamp lines */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Pinned item styling */
    .pinned {
      border-color: #4FD1C5; /* lighter teal */
      background-color: #B2F5EA; /* very light teal */
    }

    /* Pin button color */
    .pin-button {
      color: #4FD1C5;
    }

    input, textarea, select, button {
      transition: all 0.3s ease;
    }

    /* Scrollbar tweaks for sidebar */
    #historySidebar::-webkit-scrollbar {
      width: 8px;
    }
    #historySidebar::-webkit-scrollbar-thumb {
      background-color: #4FD1C5;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside id="historySidebar" class="fixed top-0 left-0 h-screen w-72 bg-white/90 backdrop-blur-md border-r border-teal-300 p-5 hidden sm:flex flex-col overflow-hidden shadow-lg z-50">
    <div class="flex justify-between items-center mb-5">
      <h2 class="text-xl font-semibold text-teal-700 tracking-wide">History</h2>
      <button id="clearHistory" class="text-sm font-semibold text-red-500 hover:text-red-600 transition">Clear</button>
    </div>

    <input
      type="text"
      id="historySearch"
      placeholder="Search history..."
      class="w-full px-4 py-3 mb-4 border border-teal-300 rounded-lg placeholder-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400"
      autocomplete="off"
    />

    <div class="overflow-y-auto flex-1 pr-1 scrollbar-thin scrollbar-thumb-teal-400 scrollbar-track-teal-100">
      <ul id="historyList" class="space-y-3 text-sm text-teal-900"></ul>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="sm:ml-72 flex-1 p-8">
    <div class="max-w-4xl mx-auto bg-white/90 backdrop-blur-md shadow-xl rounded-3xl p-10 border border-teal-200 space-y-10">

      <!-- Header -->
      <header class="text-center select-none space-y-2">
        <div class="flex items-center justify-center gap-3 text-teal-700 text-5xl font-extrabold tracking-tight leading-tight">
          <img 
            src="../images/chatgpt.png" 
            alt="ChatGPT Logo" 
            class="w-14 h-14 p-1 rounded-full shadow-md object-contain"
          />
          <span>ChatGPT</span>
        </div>
        <p class="text-teal-600 text-lg tracking-wide font-light italic">Generate high-quality content in seconds</p>
        <button id="toggleSidebar" class="sm:hidden mt-4 text-teal-600 font-semibold hover:underline transition focus:outline-none focus:ring-2 focus:ring-teal-400 rounded">Toggle History</button>
      </header>

      <!-- Template Selector -->
      <section>
        <label for="templateSelect" class="block mb-2 font-semibold text-teal-800">Choose Template:</label>
        <select
          id="templateSelect"
          class="w-full p-4 border border-teal-300 rounded-xl bg-white text-teal-900 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400"
        >
          <option value="">-- Select a Template --</option>
          <option value="Write a detailed blog post about ">Blog Post</option>
          <option value="Create a professional email about ">Email</option>
          <option value="Generate a product description for ">Product Description</option>
          <option value="Write an engaging social media post about ">Social Media Post</option>
        </select>
      </section>

      <!-- Prompt Input -->
      <section>
        <textarea
          id="promptInput"
          class="w-full h-40 p-5 rounded-2xl border border-teal-300 resize-none text-teal-900 text-lg placeholder-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400 shadow-inner"
          placeholder="Type your writing prompt here..."
          spellcheck="false"
        ></textarea>
      </section>

      <!-- Tone & Generate -->
      <section class="grid sm:grid-cols-2 gap-6">
        <div>
          <label for="toneSelect" class="block mb-2 text-sm font-medium text-teal-700">Select Tone</label>
          <select
            id="toneSelect"
            class="w-full p-4 border border-teal-300 rounded-2xl bg-white text-teal-900 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400"
          >
            <option value="formal">Formal</option>
            <option value="casual">Casual</option>
            <option value="friendly">Friendly</option>
            <option value="professional">Professional</option>
          </select>
        </div>
        <div class="flex items-end">
          <button
            id="generateBtn"
            class="w-full py-4 bg-gradient-to-r from-teal-600 to-teal-400 hover:from-teal-700 hover:to-teal-500 text-white font-semibold rounded-2xl shadow-lg transition duration-300 ease-in-out focus:outline-none focus:ring-4 focus:ring-teal-400"
          >
            Generate Content
          </button>
        </div>
      </section>

      <!-- AI Result Display -->
      <section
        id="resultContainer"
        class="hidden mt-8 bg-white/90 p-8 border border-teal-200 rounded-3xl shadow-xl space-y-8 backdrop-blur-md"
      >
        <div
          id="loadingSpinner"
          class="loading-spinner mx-auto my-6 border-4 border-teal-500 border-t-transparent rounded-full w-10 h-10 animate-spin hidden"
          aria-label="Loading"
          role="status"
        ></div>

        <div class="flex items-center gap-3 text-teal-700 text-xl font-semibold select-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
          AI Response
        </div>

        <article
          id="resultText"
          class="text-teal-800 text-base leading-relaxed prose max-w-none whitespace-pre-wrap min-h-[120px]"
        ></article>

        <button
          id="copyBtn"
          class="hidden bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-xl shadow-md transition focus:outline-none focus:ring-2 focus:ring-teal-400"
        >
          Copy to Clipboard
        </button>

        <!-- Export Buttons -->
        <div class="flex gap-4 justify-end pt-5 border-t border-teal-200">
          <button
            id="saveBtn"
            class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-xl shadow-md transition focus:outline-none focus:ring-2 focus:ring-green-400"
          >
            Save as .txt
          </button>
          <button
            id="exportDocxBtn"
            class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-xl shadow-md transition focus:outline-none focus:ring-2 focus:ring-purple-400"
          >
            Export as .docx
          </button>
          <button
            id="exportPdfBtn"
            class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-xl shadow-md transition focus:outline-none focus:ring-2 focus:ring-red-400"
          >
            Export as .pdf
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- JS Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/docx@8.2.2/build/index.umd.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
